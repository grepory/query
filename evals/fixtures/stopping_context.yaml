    question_ids: [capacity]
    kind: ask_user
    missing_evidence: The user definition changes whether 900 MW operational or 1200 MW total announced
      is responsive.
    consequence: The operational total or its qualification could change.
    next_action: Ask whether the requirement is operational-only or total announced capacity.
