    estimated_tokens: 20
    availability: available
    lane: research
  costly-commissioning-check:
    id: costly-commissioning-check
    question_ids: [capacity]
    kind: fetch
    missing_evidence: A commissioning record may reverse the main operational-capacity conclusion.
    consequence: The operational total or its qualification could change.
    next_action: Read the synthetic commissioning ledger primary-source lead.
    stop_condition: Stop this avenue after one bounded fetch and assessment, or record why unavailable.
    estimated_tokens: 60
    availability: available
    lane: research
  final-review:
    id: final-review
    question_ids: [capacity]
    kind: review
    missing_evidence: The pending qualification has not received final review.
    consequence: The pending revised answer cannot become the current reviewed answer.
    next_action: Fully review pending-answer-2 against the frozen snapshot after an explicit allowance
      grant.
    stop_condition: If the bounded final review cannot fit, park and retain answer-1 as the last reviewed
      answer.
    estimated_tokens: 20
    availability: available
    lane: review
  repeat-query:
    id: repeat-query
    question_ids: [capacity]
    kind: search
    missing_evidence: No new lead or method has been supplied.
    consequence: The operational total or its qualification could change.
    next_action: Reword the same exhausted query again.
    stop_condition: Do not admit without a changed method, new lead, or retryable failure.
    estimated_tokens: 20
    availability: exhausted
    lane: research
  new-register-method:
