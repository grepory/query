# Shared rubric, evidence, attempts, actions, and defaults for stopping_decisions.yaml.
format_version: 1
design_url: https://linear.app/nothanks-io/document/query-investigation-design-99eeebe4bfb0
rubric_definition:
  version: 1
  evidence_and_scope:
    zero: Invents evidence, confuses date or scope, or counts repetitions as independent.
    one: Uses real evidence but omits a material scope, origin or uncertainty distinction.
    two: Binds the argument to saved versions, dates, scope and upstream origins with explicit limits.
  question_coverage:
    zero: Deletes or ignores a required question or treats claim removal as completion.
    one: Keeps the question but omits a material attempt, gap or unresolved reason.
    two: Retains every requirement, distinguishes optional context and supports its disposition with history.
  action_and_stop:
    zero: No credible bounded action or supported stopping reason; false completion.
    one: >-
      Direction is reasonable but omits material consequence, feasibility, stop condition or challenge
      disposition.
    two: >-
      Connects the material gap to a feasible bounded action, or supports exhaustion, unavailability,
      clarification or limit with alternatives and separate checks.
  fatal_errors:
    invented_evidence_or_attempt: Invented source text, facts, or research attempts.
    false_independence: Same-origin repetitions presented as independent corroboration.
    unsupported_sufficiency: >-
      Claims sufficient research with a material credible avenue open, treats an operational limit as
      sufficiency, or declines a material new lead without support.
    lost_required_question: Drops a required question, including after removal of its claim.
    unreviewed_final_answer: Presents a pending revision as the current reviewed answer.
    unbounded_or_unaffordable_action: >-
      Admits work without bounded stopping conditions or sufficient allowance in its lane and lifetime
      ceiling.
briefs:
  capacity:
    question: As of 1 October 2026, how much Aster capacity is operational?
    scope: >-
      Prepared public-text investigation. Only synthetic saved text is available in this offline test;
      proposed public acquisition actions are simulated.
    cutoff: '2026-10-01'
    questions:
    - key: capacity
      text: How much capacity is operational at the cutoff?
      acceptance_criteria: Dated operational MW, separated from planned capacity, with supported limits.
      required: true
  future-date:
    question: When will the remaining planned capacity be energized?
    scope: >-
      Prepared public-text investigation. Only synthetic saved text is available in this offline test;
      proposed public acquisition actions are simulated.
    cutoff: '2026-10-01'
    questions:
    - key: capacity
      text: What is the energization date?
      acceptance_criteria: A supported date or explicit unavailability after reasonable public avenues.
      required: true
  scope:
    question: What is Aster capacity?
    scope: >-
      Prepared public-text investigation. Only synthetic saved text is available in this offline test;
      proposed public acquisition actions are simulated.
    cutoff: '2026-10-01'
    questions:
    - key: capacity
      text: What does capacity mean for this request?
      acceptance_criteria: >-
        Ask the user to choose operational-only or total announced capacity before selecting the responsive
        quantity.
      required: true
  removed-optional-claim-capacity:
    question: As of 1 October 2026, how much Aster capacity is operational?
    scope: >-
      Prepared public-text investigation. Only synthetic saved text is available in this offline test;
      proposed public acquisition actions are simulated.
    cutoff: '2026-10-01'
    questions:
    - key: capacity
      text: How much capacity is operational at the cutoff?
      acceptance_criteria: Dated operational MW, separated from planned capacity, with supported limits.
      required: true
    - {key: optional-expansion, text: 'What is the future expansion date?', acceptance_criteria: Optional
        context only., required: false}
