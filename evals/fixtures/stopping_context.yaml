    estimated_tokens: 0
    availability: available
    lane: review
  new-grid-register:
    id: new-grid-register
    question_ids: [capacity]
    kind: fetch
    missing_evidence: A newly identified register may disclose another energized site.
    consequence: The operational total or its qualification could change.
    next_action: Read the concrete register once and assess additional operational capacity.
