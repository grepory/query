    kind: ask_user
    missing_evidence: The user can supply the decisive signed schedule.
    consequence: A supplied schedule could resolve or qualify the requested energization date.
    next_action: Ask the user for the schedule and permitted scope of use.
    stop_condition: Wait for the user document; do not guess its contents.
    estimated_tokens: 0
    availability: available
    lane: review
  independent-ledger:
    id: independent-ledger
    question_ids: [capacity]
    kind: fetch
    missing_evidence: Ten outlets share one press-release origin; independent commissioning support is
