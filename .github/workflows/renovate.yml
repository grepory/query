name: Renovate

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.repository == 'grepory/query'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Renovate credentials
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo '::error::Add the RENOVATE_TOKEN Actions secret; see README.md.'
            exit 1
          fi
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.11
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
