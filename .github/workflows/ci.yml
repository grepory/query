name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: query_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d query_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/query_test
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: mise run setup
      - run: mise run check
